name: comments-removelink
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove public download link from description
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_API_VERSION: "2026-07-01"
          PRODUCT_ID: prod_0WrqduKEM3TWZ
        run: python comments/whop_remove_link.py
