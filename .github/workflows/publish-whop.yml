# GitHub Actions: publish a Whop product from GitHub's US servers.
#
# WHY: Whop blocks API calls from RU-region IPs. GitHub Actions runners are
# hosted in the US (Azure westcentralus), so the Whop API call originates from
# an ALLOWED region. This is legitimate infrastructure, NOT a proxy/geo-bypass.
#
# SAFETY GATE: the job refuses to create the product unless DRY_RUN is false.
#   - First run with DRY_RUN="true" (default) -> prints payload, creates nothing.
#   - To actually publish, set the repo variable DRY_RUN="false" AND approve
#     (an irreversible external action).

name: publish-whop-product

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create/publish Whop product
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_API_VERSION: "2026-07-01"
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            echo "PUBLISH MODE: creating a LIVE product. Confirm this is intended."
            python gateway/whop_product_creator.py
          else
            echo "DRY-RUN MODE: no product will be created."
            DRY_RUN=true python gateway/whop_product_creator.py
          fi
